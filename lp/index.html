<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Echo Garden Father’s Day LP</title>
  <link rel="stylesheet" href="/styles/mvp.css" />
</head>
<body>
  <main class="mvp-shell">
    <p class="eyebrow">Father’s Day Landing Page</p>
    <h1>公開LPプレースホルダー</h1>
    <p class="lede">このページは最終選択済み作品と公開用メッセージだけを表示する想定です。住所などの個人情報は含めません。</p>

    <section class="mvp-card">
      <h2>公開ID</h2>
      <p id="lpIdValue">-</p>
    </section>

    <section class="mvp-card">
      <h2>公開プレビュー</h2>
      <div id="lpPreview" class="selected-summary-grid">
        <div>
          <p class="micro-copy">読み込み中です。</p>
        </div>
      </div>
    </section>

    <section class="mvp-card">
      <h2>公開データ</h2>
      <pre id="lpPayload" class="payload-box">loading...</pre>
    </section>
  </main>

  <script type="module" src="/src/mvp/lp-page.js"></script>
</body>
</html>
